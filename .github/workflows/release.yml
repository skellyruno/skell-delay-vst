# Builds and validates the Windows x64 VST3 product. No AU/macOS or Linux targets are produced.
# Code signing and installer creation are optional and require owner-provided Windows certificate secrets. Secrets are listed in installer/README.md.
name: Build and validate Windows VST3
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only superseded pull-request runs are cancellable. Main, tags and manual builds
# receive unique groups and are never cancelled by a newer PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for release package verifier
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Windows release package verifier
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_release_package.py" -v

      - name: Configure
        run: cmake -S . -B build -A x64 -DSKELL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      # Capture a Windows minidump if dsp_tests crashes before main() or before
      # its own diagnostic prints. This is best-effort and never blocks tests.
      - name: Enable Windows DSP crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP 'SkellDelayCrashDumps'
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\dsp_tests.exe'
          try {
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
            Write-Host "Configured Windows Error Reporting minidumps: $dumpDir"
          } catch {
            Write-Warning "Could not configure Windows Error Reporting minidumps; continuing without them: $($_.Exception.Message)"
          }

      - name: Run the tests (DSP, stress, real-time)
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --timeout 1800

      - name: Preserve CTest failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-CTest-Diagnostics-Windows
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve Windows DSP crash dump
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-DSP-CrashDump-Windows
          path: ${{ runner.temp }}/SkellDelayCrashDumps/*.dmp
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve Windows DSP executable and symbols
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-DSP-Debug-Symbols-Windows
          path: |
            build/dsp_tests_artefacts/Release/dsp_tests.exe
            build/dsp_tests_artefacts/Release/dsp_tests.pdb
          if-no-files-found: warn
          retention-days: 14

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -L -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip"
          unzip -q pv.zip
          VST3="build/DelayPlugin_artefacts/Release/VST3/Skell-Delay.vst3"
          test -d "$VST3" || { echo "Missing Windows VST3 bundle: $VST3"; exit 1; }
          ./pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests "$VST3"

      # ---------- Windows signing and installer packaging (owner secrets only) ----------
      - name: Windows sign and package
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && env.WIN_CERT_PFX != ''
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: ./installer/windows/build_installer.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - name: Stage and verify Windows VST3 release package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ciCommit = (git rev-parse HEAD).Trim()
          python scripts/verify_windows_vst3.py --source-bundle "build/DelayPlugin_artefacts/Release/VST3/Skell-Delay.vst3" --package-dir "package" --cmake "CMakeLists.txt" --source-commit "$env:SOURCE_COMMIT" --ci-commit "$ciCommit" --run-id "$env:GITHUB_RUN_ID" --pluginval-strictness 10

      - name: Test private-preview install, update and rollback
        shell: pwsh
        run: ./installer/windows/Test-SkellDelayPreviewInstaller.ps1 -PackagePath package

      - name: Upload validated Windows VST3 and installer artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-Windows-VST3-${{ github.sha }}
          path: |
            package/
            dist/**
          if-no-files-found: error
          retention-days: 7

