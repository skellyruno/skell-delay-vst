# Builds Skell-Delay on Windows, macOS and Linux, runs the tests and pluginval, and (when the secrets exist) signs, notarises
# and packages. NOT YET RUN: expect to fix small things the first time. Secrets are listed in installer/README.md.
name: build-test-package
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only superseded pull-request runs are cancellable. Main, tags and manual builds
# receive unique groups and are never cancelled by a newer PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows, pv: pluginval_Windows.zip }
          - { os: macos-latest,   name: macOS,   pv: pluginval_macOS.zip }
          - { os: ubuntu-22.04,   name: Linux,   pv: pluginval_Linux.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSKELL_BUILD_TESTS=ON ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      # Capture a Windows minidump if dsp_tests crashes before main() or before
      # its own diagnostic prints. This is best-effort and never blocks tests.
      - name: Enable Windows DSP crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP 'SkellDelayCrashDumps'
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\dsp_tests.exe'
          try {
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
            Write-Host "Configured Windows Error Reporting minidumps: $dumpDir"
          } catch {
            Write-Warning "Could not configure Windows Error Reporting minidumps; continuing without them: $($_.Exception.Message)"
          }

      - name: Run the tests (DSP, stress, real-time)
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --timeout 1800

      - name: Preserve CTest failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-CTest-Diagnostics-${{ matrix.name }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve Windows DSP crash dump
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-DSP-CrashDump-Windows
          path: ${{ runner.temp }}/SkellDelayCrashDumps/*.dmp
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve Windows DSP executable and symbols
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-DSP-Debug-Symbols-Windows
          path: |
            build/dsp_tests_artefacts/Release/dsp_tests.exe
            build/dsp_tests_artefacts/Release/dsp_tests.pdb
          if-no-files-found: warn
          retention-days: 14

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -L -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pv }}"
          unzip -q pv.zip
          VST3=$(find build -name "*.vst3" -maxdepth 6 | head -1)
          echo "validating $VST3"
          case "${{ runner.os }}" in
            Windows) ./pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests "$VST3" ;;
            macOS)
                     ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "$VST3"
                     AU=$(find build -name "*.component" -maxdepth 6 | head -1)
                     [ -n "$AU" ] || { echo "Missing AU component bundle"; exit 1; }
                     AU_ROOT="$HOME/Library/Audio/Plug-Ins/Components"
                     mkdir -p "$AU_ROOT"
                     rm -rf "$AU_ROOT/Skell-Delay.component"
                     ditto "$AU" "$AU_ROOT/Skell-Delay.component"
                     killall -9 AudioComponentRegistrar 2>/dev/null || true
                     auval -v aufx Dlay Skly ;;
            Linux)   xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
          esac

      # ---------- signing / notarising / packaging: only when the secrets are set ----------
      - name: macOS sign, notarise, package
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
        run: bash installer/macos/build_pkg.sh "${GITHUB_REF_NAME#v}"

      - name: Windows sign and package
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && env.WIN_CERT_PFX != ''
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: ./installer/windows/build_installer.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - name: Verify Windows VST3 bundle, PE binary and strict module metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'build/DelayPlugin_artefacts/Release/VST3'
          if (-not (Test-Path -LiteralPath $root)) { throw "Missing VST3 output directory: $root" }

          $bundles = @(Get-ChildItem -LiteralPath $root -Directory -Filter '*.vst3')
          if ($bundles.Count -ne 1) { throw "Expected exactly one VST3 bundle; found $($bundles.Count)" }
          $bundle = $bundles[0]

          $binaries = @(Get-ChildItem -LiteralPath $bundle.FullName -Recurse -File -Filter '*.vst3')
          if ($binaries.Count -ne 1) { throw "Expected exactly one Windows VST3 binary; found $($binaries.Count)" }
          $binary = $binaries[0]
          $bytes = [System.IO.File]::ReadAllBytes($binary.FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'VST3 binary is not a Windows PE (MZ)' }

          $cmake = Get-Content -LiteralPath 'CMakeLists.txt' -Raw
          if ($cmake -notmatch 'COMPANY_NAME\s+"([^"]+)"') { throw 'Could not read COMPANY_NAME from CMakeLists.txt' }
          $expectedVendor = $Matches[1]
          if ($cmake -notmatch 'PRODUCT_NAME\s+"([^"]+)"') { throw 'Could not read PRODUCT_NAME from CMakeLists.txt' }
          $expectedName = $Matches[1]
          if ($cmake -notmatch 'project\(DelayPlugin\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') { throw 'Could not read DelayPlugin version from CMakeLists.txt' }
          $expectedVersion = $Matches[1]

          $metadataPath = Join-Path $bundle.FullName 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path -LiteralPath $metadataPath)) { throw "Missing VST3 module metadata: $metadataPath" }

          # JUCE/Steinberg may emit trailing commas in moduleinfo.json. Normalize
          # only that extension, write strict JSON back into the bundle, then reparse
          # with default options. Other malformed JSON still fails closed.
          $relaxedOptions = [System.Text.Json.JsonDocumentOptions]::new()
          $relaxedOptions.AllowTrailingCommas = $true

          function ConvertTo-StrictJson {
            param([System.Text.Json.JsonElement]$Element)
            $buffer = [System.IO.MemoryStream]::new()
            $writer = [System.Text.Json.Utf8JsonWriter]::new($buffer)
            try {
              $Element.WriteTo($writer)
              $writer.Flush()
              return [System.Text.Encoding]::UTF8.GetString($buffer.ToArray())
            } finally {
              $writer.Dispose()
              $buffer.Dispose()
            }
          }

          # Regression probe: a comma inside a string is data, not a trailing comma.
          $probe = [System.Text.Json.JsonDocument]::Parse('{"text":"comma,}","values":[1,],}', $relaxedOptions)
          try {
            $probeJson = ConvertTo-StrictJson $probe.RootElement
          } finally {
            $probe.Dispose()
          }
          $probeStrict = [System.Text.Json.JsonDocument]::Parse($probeJson)
          try {
            if ($probeStrict.RootElement.GetProperty('text').GetString() -ne 'comma,}') {
              throw 'VST3 metadata normalization changed string content'
            }
          } finally {
            $probeStrict.Dispose()
          }

          $sourceJson = [System.IO.File]::ReadAllText($metadataPath)
          $relaxedDocument = [System.Text.Json.JsonDocument]::Parse($sourceJson, $relaxedOptions)
          try {
            $normalizedJson = ConvertTo-StrictJson $relaxedDocument.RootElement
          } finally {
            $relaxedDocument.Dispose()
          }
          [System.IO.File]::WriteAllText(
            $metadataPath,
            $normalizedJson + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

          # The packaged metadata must now pass the strict RFC 8259 parser.
          $document = [System.Text.Json.JsonDocument]::Parse([System.IO.File]::ReadAllText($metadataPath))
          try {
            $metadata = $document.RootElement
            $actualName = $metadata.GetProperty('Name').GetString()
            $actualVersion = $metadata.GetProperty('Version').GetString()
            $actualVendor = $metadata.GetProperty('Factory Info').GetProperty('Vendor').GetString()
            if ($actualName -ne $expectedName) { throw "VST3 name mismatch: expected '$expectedName', found '$actualName'" }
            if ($actualVersion -ne $expectedVersion) { throw "VST3 version mismatch: expected '$expectedVersion', found '$actualVersion'" }
            if ($actualVendor -ne $expectedVendor) { throw "VST3 vendor mismatch: expected '$expectedVendor', found '$actualVendor'" }

            $classes = $metadata.GetProperty('Classes')
            $matchingModule = $false
            foreach ($class in $classes.EnumerateArray()) {
              if ($class.GetProperty('Category').GetString() -eq 'Audio Module Class' -and
                  $class.GetProperty('Name').GetString() -eq $expectedName -and
                  $class.GetProperty('Vendor').GetString() -eq $expectedVendor -and
                  $class.GetProperty('Version').GetString() -eq $expectedVersion) {
                $matchingModule = $true
              }
            }
            if (-not $matchingModule) { throw 'No Audio Module Class matches the expected Skell Delay name, vendor and version' }
          } finally {
            $document.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash
          Write-Host "Validated bundle: $($bundle.Name)"
          Write-Host "Vendor: $actualVendor | Product: $actualName | Version: $actualVersion"
          Write-Host "Windows VST3 binary SHA-256: $hash"
          @"
          ### Windows VST3 identity gate passed
          - Bundle: $($bundle.Name)
          - Vendor: $actualVendor
          - Product/version: $actualName $actualVersion
          - Binary SHA-256: $hash
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload validated Windows VST3 and installer artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-Windows-VST3-${{ github.sha }}
          path: |
            build/DelayPlugin_artefacts/Release/VST3/*.vst3/
            dist/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS and Linux plugin artifacts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-${{ matrix.name }}
          path: |
            dist/**
            build/**/*.vst3
            build/**/*.component
          if-no-files-found: ignore
          retention-days: 7
