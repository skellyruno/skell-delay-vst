# Builds Skell-Delay on Windows, macOS and Linux, runs the tests and pluginval, and (when the secrets exist) signs, notarises
# and packages. NOT YET RUN: expect to fix small things the first time. Secrets are listed in installer/README.md.
name: build-test-package
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows, pv: pluginval_Windows.zip }
          - { os: macos-latest,   name: macOS,   pv: pluginval_macOS.zip }
          - { os: ubuntu-22.04,   name: Linux,   pv: pluginval_Linux.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSKELL_BUILD_TESTS=ON ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run the tests (DSP, stress, real-time)
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --timeout 1800

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -L -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pv }}"
          unzip -q pv.zip
          VST3=$(find build -name "*.vst3" -maxdepth 6 | head -1)
          echo "validating $VST3"
          case "${{ runner.os }}" in
            Windows) ./pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests "$VST3" ;;
            macOS)   ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "$VST3"
                     AU=$(find build -name "*.component" -maxdepth 6 | head -1); [ -n "$AU" ] && ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "$AU" ;;
            Linux)   xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
          esac

      # ---------- signing / notarising / packaging: only when the secrets are set ----------
      - name: macOS sign, notarise, package
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
        run: bash installer/macos/build_pkg.sh "${GITHUB_REF_NAME#v}"

      - name: Windows sign and package
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && env.WIN_CERT_PFX != ''
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: ./installer/windows/build_installer.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - uses: actions/upload-artifact@v4
        with:
          name: SkellDelay-${{ matrix.name }}
          path: |
            dist/**
            build/**/*.vst3
            build/**/*.component
          if-no-files-found: ignore
