name: Build VST3 Plugin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Install Linux dependencies required by JUCE graphics/audio
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreewtype6-dev libx11-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxcursor-dev libgl1-mesa-dev libasound2-dev

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DCSOUND_BUILD_STATIC=ON

    - name: Build Plugin Target
      run: cmake --build build --config Release

    # Package build outputs as downloadable artifacts
    - name: Upload Windows VST3 Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: VST3-Windows
        path: build/DelayPlugin_artefacts/Release/VST3/*.vst3

    - name: Upload macOS VST3 Artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: VST3-macOS
        path: build/DelayPlugin_artefacts/Release/VST3/*.vst3
